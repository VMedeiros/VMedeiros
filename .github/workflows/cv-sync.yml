name: Sync profile with CV

# Rewrites the README blocks that mirror the CV (see the comment at the top of
# README.md), so the profile always says what the CV says.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/cv-sync.yml"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Read the CV and update README.md
        run: node scripts/sync-cv.mjs

      - name: Commit if the CV changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already matches the CV."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync profile with the CV"
          git push
